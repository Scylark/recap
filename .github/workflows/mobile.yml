name: Mobile SDK, dashboard and database

on:
  push:
    paths: ['sdk-react-native/**', 'dashboard/**', 'supabase/**', 'scripts/**', 'src/analysis/**', 'src/types.ts', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['sdk-react-native/**', 'dashboard/**', 'supabase/**', 'scripts/**', 'src/analysis/**', 'src/types.ts', '.github/workflows/mobile.yml']

jobs:
  sdk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: sdk-react-native } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  dashboard:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: dashboard } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: postgres, PGDATABASE: postgres }
    steps:
      - uses: actions/checkout@v7
      - name: Every migration has its own version (supabase db push needs this)
        run: test -z "$(ls supabase/migrations/*.sql | xargs -n1 basename | cut -d_ -f1 | sort | uniq -d)"
      - name: supabase/setup.sql (the one-file setup) matches the migrations
        run: node scripts/build-setup-sql.mjs --check
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/supabase-shim.sql
      - name: Apply every migration
        run: for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -f "$f"; done
      - name: Apply them again (they must be safe to re-run)
        run: for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -f "$f"; done
      - name: The one-file setup works on a fresh database, and runs again cleanly
        run: |
          psql -v ON_ERROR_STOP=1 -c 'create database setup_check'
          PGDATABASE=setup_check psql -v ON_ERROR_STOP=1 -f supabase/tests/supabase-shim.sql
          PGDATABASE=setup_check psql -v ON_ERROR_STOP=1 -f supabase/setup.sql
          PGDATABASE=setup_check psql -v ON_ERROR_STOP=1 -f supabase/setup.sql
          PGDATABASE=setup_check psql -v ON_ERROR_STOP=1 -tAc "select count(distinct p.proname) from pg_proc p join pg_namespace n on n.oid = p.pronamespace where n.nspname = 'public' and p.proname like 'recap\_%'" | grep -qx 25
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/security.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/analytics-and-screens.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/recordings.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/dom.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/storage-limits.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/dom-limits.sql
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Analytics in the database match the demo's numbers
        working-directory: dashboard
        run: npm ci && npx vitest run tests/analytics-parity.test.ts
        env:
          TZ: UTC
          RECAP_TEST_PG: postgresql://postgres:postgres@localhost:5432/postgres
