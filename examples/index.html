<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DemoApp</title>
  <style>
    /* Generic product-site look: light grey panels, large centred headlines, a
       translucent dark top bar and blue pill buttons. Styling only. */
    :root {
      --ink: #1d1d1f;
      --ink-2: #6e6e73;
      --bg: #ffffff;
      --bg-2: #f5f5f7;
      --line: #d2d2d7;
      --line-soft: #e8e8ed;
      --blue: #0066cc;
      --blue-btn: #0071e3;
      --blue-btn-hover: #0077ed;
      --nav-bg: rgba(22, 22, 23, 0.8);
      --nav-ink: #e8e8ed;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
      font-size: 17px; line-height: 1.47059; letter-spacing: -0.022em;
      color: var(--ink); background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--blue); }

    /* Top bar */
    header {
      background: var(--nav-bg); color: var(--nav-ink);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      backdrop-filter: saturate(180%) blur(20px);
      padding: 0 24px; height: 52px;
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 100;
    }
    .logo { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; color: #fff; white-space: nowrap; text-decoration: none; }
    nav { display: flex; gap: 28px; justify-content: center; flex: 1; }
    nav a {
      color: var(--nav-ink); text-decoration: none; font-size: 12px; font-weight: 400;
      opacity: 0.8; transition: opacity 0.2s;
    }
    nav a:hover { opacity: 1; }
    nav a.active { opacity: 1; color: #fff; }
    #open-recap {
      background: var(--blue-btn); color: #fff; border: none;
      border-radius: 980px; padding: 5px 14px; font-size: 12px; font-family: inherit;
      cursor: pointer; white-space: nowrap; transition: background 0.2s;
    }
    #open-recap:hover { background: var(--blue-btn-hover); }

    /* Layout */
    main { max-width: 1040px; margin: 0 auto; padding: 40px 24px 72px; min-height: calc(100vh - 52px - 120px); }
    footer {
      background: var(--bg-2); color: var(--ink-2); padding: 24px;
      border-top: 1px solid var(--line-soft); font-size: 12px; text-align: center;
    }
    footer .foot-links { display: flex; gap: 20px; justify-content: center; margin-bottom: 12px; flex-wrap: wrap; }
    footer .foot-links a { color: var(--ink-2); text-decoration: none; }
    footer .foot-links a:hover { text-decoration: underline; }
    footer kbd {
      background: var(--bg); color: var(--ink); padding: 1px 6px;
      border: 1px solid var(--line); border-radius: 4px; font-family: inherit; font-size: 12px;
    }

    /* Breadcrumb */
    .breadcrumb { font-size: 14px; color: var(--ink-2); margin-bottom: 16px; text-align: center; }
    .breadcrumb a { color: var(--blue); text-decoration: none; }
    .breadcrumb a:hover { text-decoration: underline; }

    /* Hero */
    .hero { text-align: center; padding: 16px 0 40px; }
    .hero h1 { font-size: 64px; font-weight: 600; line-height: 1.05; letter-spacing: -0.005em; color: var(--ink); }
    .hero-sub { font-size: 24px; line-height: 1.33; color: var(--ink-2); margin: 12px auto 28px; max-width: 640px; letter-spacing: 0.011em; }
    .btn-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; align-items: center; }

    /* Buttons */
    .btn {
      display: inline-block; padding: 11px 22px; border-radius: 980px;
      font-size: 17px; cursor: pointer; border: none; font-family: inherit;
      letter-spacing: -0.01em; transition: background 0.2s; text-decoration: none;
    }
    .btn-primary { background: var(--blue-btn); color: #fff; }
    .btn-primary:hover { background: var(--blue-btn-hover); }
    .btn-secondary { background: transparent; color: var(--blue); padding-left: 8px; padding-right: 8px; }
    .btn-secondary:hover { text-decoration: underline; }

    /* Product tiles */
    .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    .tile {
      background: var(--bg-2); border-radius: 18px; padding: 48px 32px; text-align: center;
      cursor: pointer; transition: background 0.2s;
    }
    .tile:hover { background: var(--line-soft); }
    .tile h2 { font-size: 40px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); margin-bottom: 8px; }
    .tile p { color: var(--ink-2); font-size: 21px; line-height: 1.38; margin-bottom: 18px; }
    .tile .btn-row { gap: 16px; }

    /* Feature bands */
    .band {
      border-radius: 18px; padding: 56px 32px; text-align: center; margin-bottom: 16px; background: var(--bg-2);
    }
    .band h2 { font-size: 48px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); margin-bottom: 12px; }
    .band p { font-size: 21px; line-height: 1.38; color: var(--ink-2); margin-bottom: 22px; max-width: 720px; margin-left: auto; margin-right: auto; }
    .band-dark { background: #000; }
    .band-dark h2 { color: #f5f5f7; }
    .band-dark p { color: #a1a1a6; }
    .band-dark a { color: #2997ff; }

    /* Three small feature cards */
    .features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 16px; }
    .feature {
      background: var(--bg-2); border-radius: 18px; padding: 32px 28px;
    }
    .feature h3 { font-size: 24px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 8px; }
    .feature p { color: var(--ink-2); font-size: 17px; line-height: 1.45; margin-bottom: 14px; }
    .feature a { font-size: 17px; text-decoration: none; }
    .feature a:hover { text-decoration: underline; }

    /* Colour / finish chips */
    .chips { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin: 8px 0 24px; }
    .chip {
      padding: 8px 18px; border-radius: 980px; font-size: 15px; cursor: pointer;
      border: 1px solid var(--line); background: var(--bg); color: var(--ink);
      transition: all 0.2s; user-select: none;
    }
    .chip:hover { border-color: var(--ink-2); }
    .chip.active { background: var(--ink); border-color: var(--ink); color: var(--bg); }

    /* Spacer for scroll depth testing */
    .spacer {
      height: 420px; background: var(--bg-2); border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      color: var(--ink-2); font-size: 17px; margin: 16px 0;
    }

    /* Phone sizes */
    @media (max-width: 820px) {
      nav { gap: 16px; }
      .hero h1 { font-size: 48px; }
      .features { grid-template-columns: 1fr; }
      .band h2 { font-size: 36px; }
    }
    @media (max-width: 520px) {
      header { height: auto; padding: 10px 16px; flex-wrap: wrap; row-gap: 8px; }
      nav { order: 3; width: 100%; justify-content: space-around; gap: 8px; flex: none; }
      .logo { font-size: 15px; }
      nav a { font-size: 12px; }
      main { padding: 28px 16px 56px; }
      .hero h1 { font-size: 40px; }
      .hero-sub { font-size: 19px; }
      .tiles { grid-template-columns: 1fr; }
      .tile h2 { font-size: 32px; }
      .band { padding: 40px 20px; }
      .band h2 { font-size: 32px; }
      .band p { font-size: 19px; }
    }
  </style>
</head>
<body>

  <header>
    <a href="/" class="logo" data-ut-label="DemoApp logo">DemoApp</a>
    <nav id="nav">
      <a href="/" data-ut-label="Home nav">Home</a>
      <a href="/phone" data-ut-label="DemoPhone nav">DemoPhone</a>
      <a href="/pad" data-ut-label="DemoPad nav">DemoPad</a>
    </nav>
    <button id="open-recap" type="button">Open Recap panel</button>
  </header>

  <main id="app"><!-- content renders here --></main>

  <footer>
    <div class="foot-links">
      <a href="/" data-ut-label="Footer Home link">Home</a>
      <a href="/phone" data-ut-label="Footer DemoPhone link">DemoPhone</a>
      <a href="/pad" data-ut-label="Footer DemoPad link">DemoPad</a>
    </div>
    <p>DemoApp — Recap UX Demo &nbsp;·&nbsp; Press <kbd>Alt+Shift+Y</kbd> (or hold 3 fingers for 1.5s on touch) to open the researcher panel</p>
  </footer>

  <script type="module">
    import { Recap } from 'recap-ux';
    Recap.init({ showPanel: false, sessionName: 'demo-session' });
    document.getElementById('open-recap').addEventListener('click', () => Recap.openPanel());

    // ── Page content ───────────────────────────────────────────────────────────

    function pageHome() {
      return `
        <section class="hero">
          <h1>DemoApp.</h1>
          <p class="hero-sub">Two new ways to work, play and stay in touch. Pick the one that fits your day.</p>
        </section>

        <div class="tiles">
          <div class="tile" data-ut-label="DemoPhone tile">
            <h2>DemoPhone</h2>
            <p>Pocket-sized power with a camera that keeps up.</p>
            <div class="btn-row">
              <a href="/phone" class="btn btn-primary" data-ut-label="DemoPhone buy CTA">Buy</a>
              <a href="/phone" class="btn btn-secondary" data-ut-label="DemoPhone learn more link">Learn more ›</a>
            </div>
          </div>
          <div class="tile" data-ut-label="DemoPad tile">
            <h2>DemoPad</h2>
            <p>A bigger screen for drawing, reading and planning.</p>
            <div class="btn-row">
              <a href="/pad" class="btn btn-primary" data-ut-label="DemoPad buy CTA">Buy</a>
              <a href="/pad" class="btn btn-secondary" data-ut-label="DemoPad learn more link">Learn more ›</a>
            </div>
          </div>
        </div>

        <div class="spacer">↓ Scroll to test scroll depth tracking</div>

        <section class="band band-dark">
          <h2>Find the right one.</h2>
          <p>Compare sizes, batteries and cameras side by side. Not sure? <a href="/pad" data-ut-label="Compare link">See how DemoPad compares ›</a></p>
          <div class="btn-row">
            <a href="/phone" class="btn btn-primary" data-ut-label="Compare DemoPhone CTA">Compare DemoPhone</a>
            <a href="/pad" class="btn btn-secondary" data-ut-label="Compare DemoPad link" style="color:#2997ff">Compare DemoPad ›</a>
          </div>
        </section>

        <div class="features">
          <div class="feature" data-ut-label="Battery feature">
            <h3>All-day battery.</h3>
            <p>Enough power for a full day of messages, maps and photos.</p>
            <a href="/phone" data-ut-label="Battery feature link">Read more ›</a>
          </div>
          <div class="feature" data-ut-label="Privacy feature">
            <h3>Private by design.</h3>
            <p>Your data stays on your device unless you choose to share it.</p>
            <a href="/pad" data-ut-label="Privacy feature link">Read more ›</a>
          </div>
          <div class="feature" data-ut-label="Accessories feature">
            <h3>Works together.</h3>
            <p>Move between DemoPhone and DemoPad without missing a beat.</p>
            <a href="/pad" data-ut-label="Accessories feature link">Read more ›</a>
          </div>
        </div>
      `;
    }

    function pagePhone() {
      return `
        <div class="breadcrumb"><a href="/" data-ut-label="Phone breadcrumb home">Home</a> › DemoPhone</div>

        <section class="hero">
          <h1>DemoPhone.</h1>
          <p class="hero-sub">A bigger screen, a better camera and all-day battery. Pocket-sized, still.</p>
          <div class="btn-row">
            <a href="/phone" class="btn btn-primary" data-ut-label="Phone buy CTA">Buy</a>
            <a href="/pad" class="btn btn-secondary" data-ut-label="Phone compare link">Compare with DemoPad ›</a>
          </div>
        </section>

        <div class="chips" data-ut-label="Finish picker">
          <span class="chip active" data-ut-label="Finish Midnight">Midnight</span>
          <span class="chip" data-ut-label="Finish Silver">Silver</span>
          <span class="chip" data-ut-label="Finish Blue">Blue</span>
        </div>

        <section class="band">
          <h2>The camera.</h2>
          <p>Sharper photos in low light, and a zoom that stays crisp. Everything you need, without carrying a second camera.</p>
          <a href="/pad" class="btn btn-secondary" data-ut-label="Camera see DemoPad link">See how DemoPad captures ›</a>
        </section>

        <div class="spacer">↓ Scroll to test scroll depth tracking</div>

        <section class="band band-dark">
          <h2>All-day battery.</h2>
          <p>From the morning commute to the last photo of the evening, DemoPhone keeps going.</p>
          <div class="btn-row">
            <a href="/" class="btn btn-secondary" data-ut-label="Battery back to home link" style="color:#2997ff">Back to home ›</a>
          </div>
        </section>

        <div class="features">
          <div class="feature" data-ut-label="Phone storage feature">
            <h3>Storage.</h3>
            <p>Choose the space that suits how you use your phone.</p>
            <a href="/" data-ut-label="Storage feature link">Compare sizes ›</a>
          </div>
          <div class="feature" data-ut-label="Phone privacy feature">
            <h3>Privacy.</h3>
            <p>Control what you share, and when.</p>
            <a href="/pad" data-ut-label="Phone privacy feature link">Read more ›</a>
          </div>
          <div class="feature" data-ut-label="Phone accessories feature">
            <h3>Accessories.</h3>
            <p>Cases, chargers and straps, made to fit.</p>
            <a href="/" data-ut-label="Phone accessories feature link">Shop accessories ›</a>
          </div>
        </div>
      `;
    }

    function pagePad() {
      return `
        <div class="breadcrumb"><a href="/" data-ut-label="Pad breadcrumb home">Home</a> › DemoPad</div>

        <section class="hero">
          <h1>DemoPad.</h1>
          <p class="hero-sub">A bigger canvas for drawing, reading and planning. Light enough to take anywhere.</p>
          <div class="btn-row">
            <a href="/pad" class="btn btn-primary" data-ut-label="Pad buy CTA">Buy</a>
            <a href="/phone" class="btn btn-secondary" data-ut-label="Pad compare link">Compare with DemoPhone ›</a>
          </div>
        </section>

        <div class="chips" data-ut-label="Size picker">
          <span class="chip" data-ut-label="Size Compact">Compact</span>
          <span class="chip active" data-ut-label="Size Standard">Standard</span>
          <span class="chip" data-ut-label="Size Large">Large</span>
        </div>

        <section class="band">
          <h2>The display.</h2>
          <p>A large, bright screen with true-to-life colour. Everything looks as it should, whether you are sketching or reading.</p>
          <a href="/phone" class="btn btn-secondary" data-ut-label="Display see DemoPhone link">See the DemoPhone screen ›</a>
        </section>

        <div class="spacer">↓ Scroll to test scroll depth tracking</div>

        <section class="band band-dark">
          <h2>Built to carry.</h2>
          <p>Under a kilogram, with a slim body that slips into any bag.</p>
          <div class="btn-row">
            <a href="/" class="btn btn-secondary" data-ut-label="Carry back to home link" style="color:#2997ff">Back to home ›</a>
          </div>
        </section>

        <div class="features">
          <div class="feature" data-ut-label="Pad drawing feature">
            <h3>Drawing.</h3>
            <p>Sketch notes and mark up documents with a stylus.</p>
            <a href="/pad" data-ut-label="Drawing feature link">Read more ›</a>
          </div>
          <div class="feature" data-ut-label="Pad reading feature">
            <h3>Reading.</h3>
            <p>Comfortable on the eyes for long sessions.</p>
            <a href="/phone" data-ut-label="Reading feature link">Pair with DemoPhone ›</a>
          </div>
          <div class="feature" data-ut-label="Pad planning feature">
            <h3>Planning.</h3>
            <p>Your week on one screen, synced to your phone.</p>
            <a href="/phone" data-ut-label="Planning feature link">See how it syncs ›</a>
          </div>
        </div>
      `;
    }

    const PAGES = { '/': pageHome, '/phone': pagePhone, '/pad': pagePad };

    // ── Routing ────────────────────────────────────────────────────────────────

    function renderPage(path) {
      const render = PAGES[path] ?? PAGES['/'];
      document.getElementById('app').innerHTML = render();

      // Update active nav link
      document.querySelectorAll('#nav a').forEach(a => {
        const href = new URL(a.href).pathname;
        a.classList.toggle('active', href === path);
      });

      // Finish and size pickers (purely visual)
      document.querySelectorAll('.chips').forEach(group => {
        group.querySelectorAll('.chip').forEach(chip => {
          chip.addEventListener('click', () => {
            group.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
          });
        });
      });

      window.scrollTo(0, 0);
    }

    function navigate(path) {
      if (path === location.pathname) return;
      history.pushState(null, '', path);
      renderPage(path);
    }

    // Only the top nav changes page. Every other link is inert in this demo, so
    // links in the content and footer never jump away. Recap's own panel is left alone.
    document.addEventListener('click', (e) => {
      const a = e.target.closest('a[href]');
      // Leave Recap's panel alone, and leave download links (the panel's exports) alone,
      // otherwise the browser never gets to save the file.
      if (!a || a.closest('.recap-panel-root') || a.hasAttribute('download')) return;
      const url = new URL(a.href, location.origin);
      if (url.protocol !== 'http:' && url.protocol !== 'https:') return;
      e.preventDefault();
      if (!a.closest('#nav') || url.origin !== location.origin) return;
      navigate(url.pathname);
    });

    // Browser back / forward
    window.addEventListener('popstate', () => renderPage(location.pathname));

    // Initial render
    renderPage(location.pathname);
  </script>

</body>
</html>
